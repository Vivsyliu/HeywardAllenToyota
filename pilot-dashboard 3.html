<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-In Overview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f6f8fa; color: #1a1f36; font-family: Arial, sans-serif; font-size: 14px; min-height: 100vh; }

  /* TOP NAV */
  .topnav {
    background: #fff;
    border-bottom: 1px solid #e3e8ef;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .topnav-left { display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; }
  .logo-text { font-size: 15px; font-weight: 700; color: #1a1f36; letter-spacing: -0.3px; }
  .logo-sub { font-size: 13px; color: #8792a2; margin-left: 2px; font-weight: 400; }
  .topnav-right { font-size: 12px; color: #8792a2; }

  /* TABS */
  .tabs-bar {
    background: #fff;
    border-bottom: 1px solid #e3e8ef;
    padding: 0 32px;
    display: flex;
    align-items: flex-end;
    gap: 0;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 16px;
    font-size: 13px;
    font-family: Arial, sans-serif;
    color: #8792a2;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    font-weight: 500;
    white-space: nowrap;
  }
  .tab:hover { color: #1a1f36; }
  .tab.active { color: #1a1f36; border-bottom: 2px solid #1a1f36; font-weight: 600; }
  .tab-count { font-size: 11px; background: #f0f1f3; color: #8792a2; border-radius: 10px; padding: 1px 6px; margin-left: 5px; }
  .tab.active .tab-count { background: #1a1f36; color: #fff; }

  /* PAGE */
  .page { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }

  /* STATS ROW */
  .stats-row {
    display: flex;
    background: #fff;
    border: 1px solid #e3e8ef;
    border-radius: 8px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .stat-cell {
    flex: 1;
    padding: 20px 24px;
    border-right: 1px solid #e3e8ef;
  }
  .stat-cell:last-child { border-right: none; cursor: pointer; transition: background 0.15s; }
  .stat-cell:last-child:hover { background: #fff8f8; }
  .stat-label { font-size: 11px; color: #8792a2; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600; }
  .stat-value { font-size: 28px; font-weight: 700; color: #1a1f36; line-height: 1; }
  .stat-sub { font-size: 11px; color: #c4b5b5; margin-top: 4px; }
  .stat-value.green { color: #0d7a4e; }
  .stat-value.yellow { color: #b45309; }
  .stat-value.red { color: #b91c1c; }
  .stat-csi { color: #b91c1c; }
  .csi-arrow { font-size: 11px; color: #b91c1c88; margin-top: 4px; }

  /* SECTION */
  .section { background: #fff; border: 1px solid #e3e8ef; border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
  .section-header { padding: 16px 24px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 13px; font-weight: 600; color: #1a1f36; }
  .section-hint { font-size: 12px; color: #c8cfd8; }

  /* BARS */
  .bar-item { padding: 13px 24px; border-bottom: 1px solid #f6f8fa; display: flex; align-items: center; gap: 14px; transition: background 0.1s; }
  .bar-item:last-child { border-bottom: none; }
  .bar-item:hover { background: #fafbfc; }
  .bar-rank { width: 20px; text-align: center; font-size: 11px; color: #c8cfd8; font-weight: 600; flex-shrink: 0; }
  .bar-name { width: 150px; font-size: 13px; color: #3c4257; flex-shrink: 0; }
  .bar-track { flex: 1; height: 6px; background: #f0f2f5; border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
  .fill-green { background: linear-gradient(90deg, #34d399, #10b981); }
  .fill-yellow { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .fill-red { background: linear-gradient(90deg, #f87171, #ef4444); }
  .bar-pct { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }
  .bar-fraction { font-size: 11px; color: #c8cfd8; min-width: 44px; text-align: right; }
  .green { color: #0d7a4e; }
  .yellow { color: #b45309; }
  .red { color: #b91c1c; }

  /* TABLE */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { border-bottom: 1px solid #f0f2f5; }
  th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #8792a2; text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  th.center { text-align: center; }
  tbody tr { border-bottom: 1px solid #f6f8fa; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  td { padding: 10px 12px; color: #3c4257; vertical-align: middle; }
  td.name-cell { font-size: 12px; color: #1a1f36; font-weight: 500; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  td.center { text-align: center; }
  .yn-badge { display: inline-flex; width: 20px; height: 20px; border-radius: 5px; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .yn-y { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
  .yn-n { background: #fff0f0; color: #b91c1c; border: 1px solid #fecaca; }
  .advisor-pill { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 500; }
  .pill-cody { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .pill-daniel { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .pill-jason { background: #faf5ff; color: #6b21a8; border: 1px solid #e9d5ff; }
  .score-badge { font-size: 12px; font-weight: 700; }
  .csi-flag { font-size: 11px; color: #ef4444; margin-left: 4px; cursor: pointer; }

  /* KEY FINDINGS */
  .findings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .finding-cell { padding: 16px 24px; border-right: 1px solid #f0f2f5; border-bottom: 1px solid #f0f2f5; }
  .finding-cell:nth-child(even) { border-right: none; }
  .finding-cell:nth-last-child(-n+2) { border-bottom: none; }
  .finding-label { font-size: 10px; font-weight: 600; color: #8792a2; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .finding-value { font-size: 13px; color: #1a1f36; font-weight: 500; }
  .finding-value.green { color: #0d7a4e; }
  .finding-value.red { color: #b91c1c; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,31,54,0.4); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border: 1px solid #e3e8ef; border-radius: 10px; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.12); }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal-head-left { }
  .modal-head-label { font-size: 10px; font-weight: 600; color: #ef4444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
  .modal-head-title { font-size: 16px; font-weight: 700; color: #1a1f36; }
  .modal-close { background: #f6f8fa; border: 1px solid #e3e8ef; color: #8792a2; border-radius: 6px; width: 30px; height: 30px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; transition: all 0.15s; }
  .modal-close:hover { background: #e3e8ef; color: #1a1f36; }
  .modal-body { padding: 20px 24px; }
  .csi-card { border: 1px solid #fecaca; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .csi-card:last-child { margin-bottom: 0; }
  .csi-card-head { padding: 12px 16px; background: #fff8f8; border-bottom: 1px solid #fecaca; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .csi-card-name { font-size: 13px; font-weight: 700; color: #1a1f36; }
  .csi-card-meta { display: flex; gap: 8px; align-items: center; }
  .severity-high { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; border-radius: 4px; padding: 2px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
  .severity-medium { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 4px; padding: 2px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
  .csi-card-body { padding: 12px 16px; }
  .csi-risk-item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #fef2f2; font-size: 12px; color: #4a5568; line-height: 1.5; }
  .csi-risk-item:last-child { border-bottom: none; padding-bottom: 0; }
  .csi-risk-dot { color: #fca5a5; flex-shrink: 0; margin-top: 2px; }
</style>
</head>
<body>

<!-- Top Nav -->
<div class="topnav">
  <div class="topnav-left">
    <div class="logo-dot"></div>
    <span class="logo-text">Mae</span>
    <span class="logo-sub">/ Hayward Allen Toyota</span>
  </div>
  <div class="topnav-right">March 30–31, 2026</div>
</div>

<!-- Tabs -->
<div class="tabs-bar">
  <button class="tab active" onclick="setAdvisor('all')">All Advisors <span class="tab-count" id="cnt-all">35</span></button>
  <button class="tab" onclick="setAdvisor('Cody Self')">Cody Self <span class="tab-count">12</span></button>
  <button class="tab" onclick="setAdvisor('Daniel Hampton')">Daniel Hampton <span class="tab-count">10</span></button>
  <button class="tab" onclick="setAdvisor('Jason Trapanese')">Jason Trapanese <span class="tab-count">13</span></button>
</div>

<!-- Page -->
<div class="page">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-cell">
      <div class="stat-label">Conversations</div>
      <div class="stat-value" id="statTotal" style="color:#1a1f36">—</div>
    </div>
    <div class="stat-cell">
      <div class="stat-label">Avg Completion</div>
      <div class="stat-value" id="statAvg">—</div>
    </div>
    <div class="stat-cell" onclick="openModal()" id="csiCell">
      <div class="stat-label" style="color:#ef4444">CSI Risk</div>
      <div class="stat-value stat-csi" id="statCsi">—</div>
      <div class="csi-arrow" id="csiArrow">View flagged →</div>
    </div>
  </div>

  <!-- Completion Rates -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Check-In Overview</div>
      <div class="section-hint">Sorted by completion rate</div>
    </div>
    <div id="bars"></div>
  </div>

  <!-- Conversations Table -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Conversations</div>
      <div class="section-hint" id="tableCount">—</div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead id="tHead"></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Key Findings -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Key Findings</div>
    </div>
    <div class="findings-grid" id="findings"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-head-label">Flagged Conversations</div>
        <div class="modal-head-title">CSI Risk Radar</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>

<script>
const QUESTIONS = ["Signature","Best contact #","Confirm email","Confirm phone","Waiting","Shuttle","Pricing reviewed","Expectation set","Vehicle satisfaction"];
const Q_SHORT = ["Sig","Contact","Email","Phone","Waiting","Shuttle","Pricing","Expectation","Veh. Sat."];

const CSI_RISKS = [
  { customer:"751-7819", advisor:"Cody Self", severity:"medium", risks:[
    "Customer asked about liquid top-up and mentioned 'there was an issue' previously — not fully addressed",
    "ASM acknowledged concern but moved on without resolving it",
    "Customer had to come back to ask about price — was never proactively told",
    "Customer had to ask about timing — expectation was never set upfront"
  ]},
  { customer:"William", advisor:"Cody Self", severity:"medium", risks:[
    "Customer flagged there's still no fix available for the rear lamp light issue",
    "Customer mentioned taking his car to a quick lube for oil changes — active competitor risk",
    "Customer drives one hour to reach the dealership — retention risk if not acknowledged",
    "No empathy or effort made to address the convenience or loyalty concerns"
  ]},
  { customer:"Janice Valenco", advisor:"Daniel Hampton", severity:"high", risks:[
    "Customer discovered she was charged for two pairs of windshield wipers",
    "She had only requested one pair — back wipers replaced without consent",
    "Billing dispute left unresolved — high CSI impact if not corrected"
  ]},
  { customer:"Car Wash/Detail Customer", advisor:"Daniel Hampton", severity:"high", risks:[
    "Customer referenced a prior experience where advisor was 'very rude' — lingering dissatisfaction",
    "Current interaction was disorganized with unclear ownership ('that's for John')",
    "No acknowledgment or empathy for prior negative experience — missed recovery opportunity",
    "No clear process explanation or timeline given for the service",
    "Overall tone was casual and dismissive rather than professional"
  ]}
];

const DATA = [
  {advisor:"Cody Self",customer:"Acog",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Ramona Lopretto",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Maintenance Contract",a:[0,1,0,0,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Jackie Davis Maint.",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"93,439 Miles Customer",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"751-7819",a:[0,1,1,0,1,0,1,1,0]},
  {advisor:"Cody Self",customer:"William",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Clayton",a:[1,1,0,0,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Total Appearance OC",a:[0,0,0,1,0,0,0,0,0]},
  {advisor:"Cody Self",customer:"Starter/Fuse Truck",a:[0,0,0,1,1,0,0,1,0]},
  {advisor:"Cody Self",customer:"Marcos",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Cody Self",customer:"Carrick",a:[0,0,0,0,1,0,1,1,0]},
  {advisor:"Daniel Hampton",customer:"Amy Moulton",a:[0,0,1,1,1,1,1,1,0]},
  {advisor:"Daniel Hampton",customer:"Janice Valenco",a:[1,0,1,1,0,0,1,0,0]},
  {advisor:"Daniel Hampton",customer:"Lauren Cobb Foster",a:[0,0,1,0,1,1,0,0,0]},
  {advisor:"Daniel Hampton",customer:"Michael Hyman",a:[0,0,0,0,1,1,0,1,0]},
  {advisor:"Daniel Hampton",customer:"David Burgess",a:[0,0,1,1,1,1,1,0,0]},
  {advisor:"Daniel Hampton",customer:"Maria Martinez",a:[0,0,1,1,1,0,0,0,0]},
  {advisor:"Daniel Hampton",customer:"Christopher Estes",a:[0,0,0,0,1,1,0,1,0]},
  {advisor:"Daniel Hampton",customer:"Special-Order Tire",a:[0,0,0,0,1,0,0,1,0]},
  {advisor:"Daniel Hampton",customer:"Car Wash/Detail",a:[0,0,0,0,1,0,0,0,0]},
  {advisor:"Daniel Hampton",customer:"kgray1957@aol.com",a:[0,0,0,0,1,1,1,1,0]},
  {advisor:"Jason Trapanese",customer:"Party Appt Customer",a:[0,0,0,0,1,0,1,0,0]},
  {advisor:"Jason Trapanese",customer:"Mrs. Taylor",a:[0,0,0,0,0,0,1,0,0]},
  {advisor:"Jason Trapanese",customer:"Miss Caroline/Birdie",a:[0,0,0,0,1,0,0,1,0]},
  {advisor:"Jason Trapanese",customer:"Mrs. Hagen",a:[0,0,0,0,0,1,0,0,0]},
  {advisor:"Jason Trapanese",customer:"Justin Rychak",a:[0,0,0,1,1,0,0,0,0]},
  {advisor:"Jason Trapanese",customer:"Maint. Required Light",a:[0,0,0,0,1,0,0,0,0]},
  {advisor:"Jason Trapanese",customer:"678-863-7041",a:[0,0,0,0,1,0,0,1,0]},
  {advisor:"Jason Trapanese",customer:"Megan",a:[0,0,0,0,1,0,1,0,0]},
  {advisor:"Jason Trapanese",customer:"Read Student",a:[0,0,0,0,1,0,1,0,0]},
  {advisor:"Jason Trapanese",customer:"Tito Suarez",a:[0,0,0,0,1,0,0,1,0]},
  {advisor:"Jason Trapanese",customer:"Megan (2)",a:[0,0,0,0,1,0,1,0,0]},
];

let currentAdvisor = "all";

function colorClass(pct) { return pct>=50?"green":pct>=25?"yellow":"red"; }
function fillClass(pct) { return pct>=50?"fill-green":pct>=25?"fill-yellow":"fill-red"; }
function getFiltered() { return currentAdvisor==="all"?DATA:DATA.filter(d=>d.advisor===currentAdvisor); }
function getFilteredCSI() { return currentAdvisor==="all"?CSI_RISKS:CSI_RISKS.filter(r=>r.advisor===currentAdvisor); }

function computeStats(rows) {
  return QUESTIONS.map((q,i)=>{
    const total=rows.length, yes=rows.reduce((s,r)=>s+r.a[i],0);
    return {q, qShort:Q_SHORT[i], yes, total, pct:total?Math.round(yes/total*100):0};
  }).sort((a,b)=>b.pct-a.pct);
}

function render() {
  const rows = getFiltered();
  const stats = computeStats(rows);
  const avg = Math.round(stats.reduce((s,r)=>s+r.pct,0)/stats.length);
  const csiCount = getFilteredCSI().length;

  // Stats
  document.getElementById("statTotal").textContent = rows.length;
  const avgEl = document.getElementById("statAvg");
  avgEl.textContent = avg+"%";
  avgEl.className = "stat-value "+colorClass(avg);
  document.getElementById("statCsi").textContent = csiCount;
  document.getElementById("csiCell").style.cursor = csiCount>0?"pointer":"default";
  document.getElementById("csiArrow").style.display = csiCount>0?"block":"none";

  // Bars
  document.getElementById("bars").innerHTML = stats.map((s,i)=>`
    <div class="bar-item">
      <div class="bar-rank">${i+1}</div>
      <div class="bar-name">${s.q}</div>
      <div class="bar-track"><div class="bar-fill ${fillClass(s.pct)}" style="width:${s.pct}%"></div></div>
      <div class="bar-pct ${colorClass(s.pct)}">${s.pct}%</div>
      <div class="bar-fraction">${s.yes}/${s.total}</div>
    </div>`).join("");

  // Table
  const showAdv = currentAdvisor==="all";
  document.getElementById("tableCount").textContent = rows.length+" conversations";
  document.getElementById("tHead").innerHTML = `<tr>
    <th>Customer</th>
    ${showAdv?'<th>Advisor</th>':""}
    ${Q_SHORT.map(q=>`<th class="center">${q}</th>`).join("")}
    <th class="center">Score</th>
  </tr>`;

  const pillClass = a => a==="Cody Self"?"pill-cody":a==="Daniel Hampton"?"pill-daniel":"pill-jason";
  document.getElementById("tBody").innerHTML = rows.map(row=>{
    const score = Math.round(row.a.reduce((a,b)=>a+b,0)/9*100);
    const hasCsi = CSI_RISKS.some(r=>r.customer===row.customer&&r.advisor===row.advisor);
    return `<tr>
      <td class="name-cell">${row.customer}${hasCsi?`<span class="csi-flag" style="cursor:pointer" onclick="openModalFor('${row.customer}','${row.advisor}')">⚠</span>`:""}</td>
      ${showAdv?`<td><span class="advisor-pill ${pillClass(row.advisor)}">${row.advisor.split(" ")[0]}</span></td>`:""}
      ${row.a.map(v=>`<td class="center"><span class="yn-badge ${v?"yn-y":"yn-n"}">${v?"Y":"N"}</span></td>`).join("")}
      <td class="center"><span class="score-badge ${colorClass(score)}">${score}%</span></td>
    </tr>`;
  }).join("");

  // Findings
  const sorted = [...stats].sort((a,b)=>b.pct-a.pct);
  const never = stats.filter(s=>s.pct===0).map(s=>s.q);
  const always = stats.filter(s=>s.pct===100).map(s=>s.q);
  const cells = [
    {label:"Most completed", value: `${sorted[0].q} — ${sorted[0].pct}%`, cls:"green"},
    {label:"Least completed", value: `${sorted[sorted.length-1].q} — ${sorted[sorted.length-1].pct}%`, cls:"red"},
    {label:"Never completed (0%)", value: never.length ? never.join(", ") : "None", cls: never.length?"red":"green"},
    {label:"CSI risks flagged", value: csiCount>0?`${csiCount} conversation${csiCount>1?"s":""}  — tap to review`:"None", cls: csiCount>0?"red":"green"},
  ];
  document.getElementById("findings").innerHTML = cells.map(c=>`
    <div class="finding-cell">
      <div class="finding-label">${c.label}</div>
      <div class="finding-value ${c.cls}">${c.value}</div>
    </div>`).join("");
}

function openModalFor(customer, advisor) {
  const risk = CSI_RISKS.find(r=>r.customer===customer && r.advisor===advisor);
  if(!risk) return;
  renderModal([risk]);
  document.getElementById("modalOverlay").classList.add("open");
}

function openModal() {
  const risks = getFilteredCSI();
  if(!risks.length) return;
  renderModal(risks);
  document.getElementById("modalOverlay").classList.add("open");
}

function renderModal(risks) {
  const pillClass = a => a==="Cody Self"?"pill-cody":a==="Daniel Hampton"?"pill-daniel":"pill-jason";
  document.getElementById("modalContent").innerHTML = risks.map(r=>`
    <div class="csi-card">
      <div class="csi-card-head">
        <div class="csi-card-name">${r.customer}</div>
        <div class="csi-card-meta">
          <span class="advisor-pill ${pillClass(r.advisor)}">${r.advisor}</span>
          <span class="${r.severity==="high"?"severity-high":"severity-medium"}">${r.severity} risk</span>
        </div>
      </div>
      <div class="csi-card-body">
        ${r.risks.map(x=>`<div class="csi-risk-item"><span class="csi-risk-dot">—</span><span>${x}</span></div>`).join("")}
      </div>
    </div>`).join("");
}

function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }
function handleOverlayClick(e) { if(e.target===document.getElementById("modalOverlay")) closeModal(); }

function setAdvisor(adv) {
  currentAdvisor = adv;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab")[["all","Cody Self","Daniel Hampton","Jason Trapanese"].indexOf(adv)].classList.add("active");
  render();
}

render();
</script>
</body>
</html>
